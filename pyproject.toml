[project]
name = "paper-dots-v2"
version = "0.1.0"
description = "PaperDots — read papers, capture insights, connect knowledge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "streamlit>=1.64.0",
    "foundry @ git+https://github.com/harshit158/foundry.git@main"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
